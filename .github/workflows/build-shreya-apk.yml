name: Build Shreya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android Flutter project
        run: flutter create --platforms=android build_app

      - name: Copy app code
        run: cp lib/main.dart build_app/lib/main.dart

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shreya-cloud-kitchen-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
