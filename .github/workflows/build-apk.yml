name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create fresh Flutter Android project
        run: flutter create -t app build_app

      - name: Copy app code
        run: |
          cp -r lib/. build_app/lib/
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shreya-cloud-kitchen-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
